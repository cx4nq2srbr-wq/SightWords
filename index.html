<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Word Explorer</title>
    <!-- Include Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        #app {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border: 4px solid #ff9a9e;
            position: relative;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff6b81;
            font-size: 2.5rem;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-btn {
            background-color: #7bed9f;
            color: #2f3542;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 0 #2ed573;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 80%;
        }

        .menu-btn.medium { background-color: #ffd32a; box-shadow: 0 5px 0 #ffa801; }
        .menu-btn.hard { background-color: #ff7f50; box-shadow: 0 5px 0 #ff6348; color: white;}
        .menu-btn.secondary { background-color: #f1f2f6; box-shadow: 0 5px 0 #ced6e0; color: #2f3542; width: auto; margin-top: 20px;}

        .menu-btn:hover { transform: translateY(2px); box-shadow: 0 3px 0 currentColor; filter: brightness(0.9); }
        .menu-btn:active { transform: translateY(5px); box-shadow: none; }

        #level-selection, #mode-selection, #game-area { display: none; }
        #level-selection.active, #mode-selection.active, #game-area.active { display: block; }

        #word-display {
            font-size: 4.5rem;
            font-weight: 800;
            color: #3742fa;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .action-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #ff1e34;
            margin: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .action-btn.blue { background-color: #1e90ff; box-shadow: 0 5px 0 #0073e6; }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }

        #spelling-input {
            font-size: 2.5rem;
            padding: 10px;
            width: 80%;
            text-align: center;
            border: 3px solid #dfe4ea;
            border-radius: 15px;
            margin-bottom: 20px;
            font-family: 'Nunito', sans-serif;
            color: #2f3542;
            text-transform: lowercase;
        }
        #spelling-input:focus { outline: none; border-color: #7bed9f; }

        #feedback {
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 40px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .instruction {
            font-size: 1.2rem;
            color: #747d8c;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .lucide { stroke-width: 2.5; }
        .hidden { display: none !important; }

        /* Sound Wave Styles */
        .sound-wave {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 50px;
            margin: 15px auto;
        }
        .sound-wave.active { display: flex; }
        
        .bar {
            width: 8px;
            height: 10px; /* Default resting height */
            background-color: #ff4757;
            border-radius: 4px;
            transition: height 0.05s ease; /* Smooth reaction to voice */
        }

        /* Fallback animation if mic API fails */
        .bar.fallback-anim {
            animation: wave 1s ease-in-out infinite;
        }
        .bar.fallback-anim:nth-child(1) { animation-delay: 0.0s; }
        .bar.fallback-anim:nth-child(2) { animation-delay: 0.1s; }
        .bar.fallback-anim:nth-child(3) { animation-delay: 0.2s; }
        .bar.fallback-anim:nth-child(4) { animation-delay: 0.3s; }
        .bar.fallback-anim:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 35px; }
        }
    </style>
</head>
<body>

    <div id="app">
        <h1><i data-lucide="star"></i> Word Explorer <i data-lucide="star"></i></h1>
        
        <!-- STEP 1: Choose Level -->
        <div id="level-selection" class="active">
            <p class="instruction"><i data-lucide="bar-chart-2"></i> Choose a difficulty level!</p>
            <button class="menu-btn" onclick="selectLevel(1)">Level 1 (Easy)</button><br>
            <button class="menu-btn medium" onclick="selectLevel(2)">Level 2 (Medium)</button><br>
            <button class="menu-btn hard" onclick="selectLevel(3)">Level 3 (Hard)</button>
        </div>

        <!-- STEP 2: Choose Mode -->
        <div id="mode-selection">
            <p class="instruction"><i data-lucide="gamepad-2"></i> How do you want to play?</p>
            <button class="menu-btn" onclick="selectMode('see-say')">
                <i data-lucide="eye"></i> See & Say
            </button><br>
            <button class="menu-btn medium" onclick="selectMode('hear-spell')">
                <i data-lucide="headphones"></i> Hear & Spell
            </button><br>
            <button class="menu-btn secondary" onclick="goBack('level-selection')">
                <i data-lucide="arrow-left"></i> Back
            </button>
        </div>

        <!-- STEP 3: Game Area -->
        <div id="game-area">
            <p id="instruction-text" class="instruction"></p>
            
            <div id="see-say-area">
                <div id="word-display">word</div>
                <button class="action-btn" id="mic-btn" onclick="startBothListeners()">
                    <i data-lucide="mic"></i> Tap to Speak
                </button>
                
                <!-- Voice Reactive Sound Wave -->
                <div class="sound-wave" id="sound-wave">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>

            <div id="hear-spell-area" class="hidden">
                <button class="action-btn blue" onclick="speakWord()">
                    <i data-lucide="volume-2"></i> Hear Word
                </button><br>
                <input type="text" id="spelling-input" autocomplete="off" placeholder="type here...">
                <br>
                <button class="action-btn" onclick="checkSpelling()">
                    <i data-lucide="check"></i> Check Answer
                </button>
            </div>

            <div id="feedback"></div>
            
            <button class="menu-btn secondary" onclick="goBack('level-selection')">
                <i data-lucide="home"></i> Menu
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const wordDictionary = {
            1: ['the', 'of', 'and', 'a', 'to', 'in', 'is', 'you', 'that', 'it', 'he', 'was', 'for', 'on', 'are', 'as', 'with', 'his', 'they', 'at', 'be', 'this', 'have', 'from'],
            2: ['make', 'like', 'into', 'time', 'look', 'more', 'write', 'go', 'see', 'number', 'no', 'way', 'could', 'people', 'my', 'than', 'first', 'water', 'been', 'called', 'who', 'am', 'now', 'find'],
            3: ['long', 'down', 'day', 'did', 'get', 'come', 'made', 'may', 'part', 'over', 'new', 'sound', 'take', 'only', 'little', 'work', 'know', 'place', 'years', 'live', 'back', 'give', 'most', 'very', 'after']
        };

        let currentLevel = 1;
        let currentMode = '';
        let currentWordIndex = 0;
        let randomizedWords = [];
        let listeningTimeout = null;
        let preferredVoice = null;

        // --- High-Quality Voice Selection ---
        function loadPremiumVoices() {
            const voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;

            // Search for well-enunciated, premium English voices first
            const idealVoices = ['Samantha', 'Alex', 'Google US English', 'Daniel', 'Karen', 'Fred'];
            
            for (let name of idealVoices) {
                const found = voices.find(v => v.name.includes(name) && v.lang.startsWith('en'));
                if (found) {
                    preferredVoice = found;
                    return;
                }
            }
            // Fallback to any English voice
            preferredVoice = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
        }

        // Browsers load voices asynchronously, so we listen for the event
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadPremiumVoices;
        }

        // --- Voice Visualizer Setup ---
        let audioContext;
        let analyser;
        let visualizerStream;
        let animationId;

        async function startVisualizer() {
            try {
                visualizerStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(visualizerStream);
                
                source.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const bars = document.querySelectorAll('.bar');

                function renderFrame() {
                    animationId = requestAnimationFrame(renderFrame);
                    analyser.getByteFrequencyData(dataArray);

                    // Distribute frequency data across the 5 bars
                    const step = Math.floor(bufferLength / bars.length);
                    for (let i = 0; i < bars.length; i++) {
                        // Get the volume data (0 to 255)
                        const volume = dataArray[i * step]; 
                        // Calculate height (minimum 10px, max ~45px)
                        const height = 10 + (volume / 255) * 35; 
                        bars[i].style.height = `${height}px`;
                    }
                }
                renderFrame();
                
                // Remove fallback animation just in case
                bars.forEach(bar => bar.classList.remove('fallback-anim'));

            } catch (err) {
                console.warn("Real-time visualizer couldn't start. Falling back to CSS animation.", err);
                // Fallback to the bouncing CSS animation if permissions fail
                document.querySelectorAll('.bar').forEach(bar => bar.classList.add('fallback-anim'));
            }
        }

        function stopVisualizer() {
            if (animationId) cancelAnimationFrame(animationId);
            if (visualizerStream) {
                visualizerStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }
            // Reset visual bars
            document.querySelectorAll('.bar').forEach(bar => {
                bar.style.height = '10px';
                bar.classList.remove('fallback-anim');
            });
        }

        // --- Speech Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                stopListeningUI();
                const transcript = event.results[0][0].transcript;
                
                if (isMatch(transcript, randomizedWords[currentWordIndex])) {
                    showFeedback('<i data-lucide="check-circle-2"></i> Correct! Great job!', "success");
                    setTimeout(nextWord, 2000);
                } else {
                    showFeedback(`<i data-lucide="x-circle"></i> I heard "${transcript}". Try again!`, "error");
                }
            };

            recognition.onerror = function(event) {
                stopListeningUI();
                if(event.error !== 'aborted') {
                    showFeedback('<i data-lucide="mic-off"></i> Mic error. Make sure it is allowed!', "error");
                }
            };

            recognition.onend = function() {
                stopListeningUI();
            };
        }

        function shuffleArray(array) {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function isMatch(transcript, target) {
            let spoken = transcript.toLowerCase().replace(/[.,!?]/g, "").trim();
            let targetLower = target.toLowerCase();
            
            if (spoken === targetLower) return true;
            
            let spokenWords = spoken.split(" ");
            if (spokenWords.includes(targetLower)) return true;

            const homophones = {
                'a': ['uh', 'ah', 'hey', 'i'],
                'to': ['two', 'too'],
                'of': ['uhv', 'ov', 'love'],
                'in': ['en', 'and'],
                'is': ['his', 'yes'],
                'you': ['u'],
                'for': ['four', 'or'],
                'on': ['an'],
                'are': ['our', 'r'],
                'with': ['wif'],
                'they': ['day'],
                'be': ['bee'],
                'have': ['half'],
                'make': ['mate'],
                'like': ['light'],
                'time': ['tome'],
                'look': ['luke'],
                'write': ['right'],
                'see': ['sea', 'c'],
                'no': ['know'],
                'way': ['weigh'],
                'know': ['no'],
                'new': ['knew'],
                'some': ['sum'],
                'one': ['won']
            };

            if (homophones[targetLower]) {
                for (let word of spokenWords) {
                    if (homophones[targetLower].includes(word)) return true;
                }
            }
            return false;
        }

        function selectLevel(level) {
            currentLevel = level;
            document.getElementById('level-selection').classList.remove('active');
            document.getElementById('mode-selection').classList.add('active');
        }

        function selectMode(mode) {
            currentMode = mode;
            currentWordIndex = 0;
            randomizedWords = shuffleArray(wordDictionary[currentLevel]);
            
            document.getElementById('mode-selection').classList.remove('active');
            document.getElementById('game-area').classList.add('active');
            loadPremiumVoices(); // Try fetching voices again just in case
            loadWord();
        }

        function goBack(targetId) {
            document.getElementById('level-selection').classList.remove('active');
            document.getElementById('mode-selection').classList.remove('active');
            document.getElementById('game-area').classList.remove('active');
            document.getElementById(targetId).classList.add('active');
            stopListeningUI();
            if(recognition) recognition.abort();
        }

        function loadWord() {
            document.getElementById('feedback').innerHTML = "";
            let currentWord = randomizedWords[currentWordIndex];

            const seeSayArea = document.getElementById('see-say-area');
            const hearSpellArea = document.getElementById('hear-spell-area');
            const instruction = document.getElementById('instruction-text');

            if (currentMode === 'see-say') {
                seeSayArea.classList.remove('hidden');
                hearSpellArea.classList.add('hidden');
                document.getElementById('word-display').innerText = currentWord;
                instruction.innerHTML = '<i data-lucide="eye"></i> Look, tap the mic, and say it loud!';
            } else {
                seeSayArea.classList.add('hidden');
                hearSpellArea.classList.remove('hidden');
                document.getElementById('spelling-input').value = "";
                instruction.innerHTML = '<i data-lucide="headphones"></i> Listen to the word and type it!';
                speakWord();
            }
            lucide.createIcons();
        }

        function startBothListeners() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Safari on iOS or Chrome.");
                return;
            }
            
            try {
                // Start speech to text
                recognition.start();
                
                // Start the visual wave effect
                startVisualizer();
                
                document.getElementById('sound-wave').classList.add('active');
                document.getElementById('mic-btn').classList.add('hidden');
                showFeedback('<i data-lucide="radio"></i> Listening...', "warning");
                
                // 6-second timeout
                clearTimeout(listeningTimeout);
                listeningTimeout = setTimeout(() => {
                    if (recognition) recognition.stop();
                    stopListeningUI();
                    showFeedback('<i data-lucide="clock"></i> Time is up! Tap to try again.', "error");
                }, 6000);

            } catch(e) {
                console.warn(e);
            }
        }

        function stopListeningUI() {
            clearTimeout(listeningTimeout);
            stopVisualizer();
            document.getElementById('sound-wave').classList.remove('active');
            document.getElementById('mic-btn').classList.remove('hidden');
        }

        function speakWord() {
            if (!preferredVoice) loadPremiumVoices(); // Final check for good voices
            
            const utterance = new SpeechSynthesisUtterance(randomizedWords[currentWordIndex]);
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.rate = 0.8; // Nice and clear
            window.speechSynthesis.speak(utterance);
        }

        function checkSpelling() {
            const input = document.getElementById('spelling-input').value.toLowerCase().trim();
            if (input === randomizedWords[currentWordIndex]) {
                showFeedback('<i data-lucide="check-circle-2"></i> Perfect spelling!', "success");
                setTimeout(nextWord, 2000);
            } else {
                showFeedback('<i data-lucide="x-circle"></i> Oops! Try again.', "error");
            }
        }

        function nextWord() {
            currentWordIndex++;
            if (currentWordIndex < randomizedWords.length) {
                loadWord();
            } else {
                document.getElementById('instruction-text').innerHTML = 'Level Complete! <i data-lucide="award"></i>';
                document.getElementById('see-say-area').classList.add('hidden');
                document.getElementById('hear-spell-area').classList.add('hidden');
                
                const feedbackEl = document.getElementById('feedback');
                feedbackEl.innerHTML = '<i data-lucide="sparkles"></i> WOW! YOU DID IT! <i data-lucide="sparkles"></i>';
                feedbackEl.style.color = "#ff4757";
                lucide.createIcons();
            }
        }

        function showFeedback(htmlContent, type) {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.innerHTML = htmlContent;
            
            if (type === 'success') feedbackEl.style.color = '#2ed573';
            else if (type === 'error') feedbackEl.style.color = '#ff4757';
            else feedbackEl.style.color = '#ffa502'; 
            
            lucide.createIcons();
        }
    </script>
</body>
</html>
